plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.displayxr.mc3d.bridge'
    compileSdk 35
    ndkVersion '26.3.11579264'
    buildFeatures { prefab true }

    defaultConfig {
        applicationId 'com.displayxr.mc3d.bridge'
        minSdk 29
        targetSdk 31   // same as the DisplayXR samples (runtime discovery validated at 31)
        versionCode 54
        versionName '0.5.4'
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.63'
}
